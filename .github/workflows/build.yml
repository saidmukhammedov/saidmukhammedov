name: Update profile

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["*.svg"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "saidmukhammedov"
          git config user.email "akbaraliabduganievich@gmail.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Update stats"
          git push
